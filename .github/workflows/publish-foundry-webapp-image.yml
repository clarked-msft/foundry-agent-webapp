name: Publish Foundry webapp image

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - deployment/docker/frontend.Dockerfile
      - .github/workflows/publish-foundry-webapp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-foundry-webapp-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: iisd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/frontend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ vars.CONTAINER_IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ vars.CONTAINER_IMAGE_NAME }}:latest
          build-args: |
            ENTRA_SPA_CLIENT_ID=${{ vars.ENTRA_SPA_CLIENT_ID }}
            ENTRA_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}
            ENTRA_AUTHORITY=${{ vars.ENTRA_AUTHORITY }}
            ENTRA_BACKEND_CLIENT_ID=${{ vars.ENTRA_BACKEND_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
